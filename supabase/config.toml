# Configuracion minima de Supabase local (esqueleto).
# `supabase start` / `db reset` requieren Docker. Los detalles de auth y RLS se
# cierran en el PR de contratos (docs/ARQUITECTURA.md 6 y 9).

project_id = "hackods"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# `supabase db reset` ya corre seed.sql cuando esto esta en true.
[db.seed]
enabled = true
# El orden importa: demo-grande.sql depende de las ollas/insumos/menus de seed.sql.
sql_paths = ["./seed.sql", "./seeds/demo-grande.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_anonymous_sign_ins = true
